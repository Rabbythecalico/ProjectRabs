<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ProjectRabs — Beautiful Comments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Dancing+Script:wght@400;700&family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Poppins:wght@400;600;700&family=Merriweather:wght@400;700&family=Abril+Fatface&family=Great+Vibes&family=Raleway:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PROJECTRABS — BEAUTIFUL COMMENTS
   ============================================================ */

/* ====== ROOT VARIABLES ====== */
:root {
  --bg: #FBF3FF;
  --bg-secondary: #FFFFFF;
  --bg-card: #FFFFFF;
  --bg-nav: #FFFFFF;
  --text-primary: #3D2C5F;
  --text-secondary: #6b5b8f;
  --text-muted: #9a8ab5;
  --border-color: #eadffc;
  --shadow: rgba(61,44,95,0.18);
  --shadow-lg: rgba(61,44,95,0.25);
  --accent1: #FF6FA5;
  --accent2: #2EC4B6;
  --accent3: #FFD23F;
  --accent4: #6C5CE7;
  --danger: #e14b6a;
  --success: #0e7d5a;
  --warning: #7a5c00;
  --bg-warning: #fff8e1;
  --input-bg: #fffdfe;
  --modal-overlay: rgba(61,44,95,0.45);
  --tag-bg: #f2e9ff;
  --comment-bg: #fbf7ff;
  
  --font-family-body: 'Quicksand', sans-serif;
  --font-family-heading: 'Fredoka', sans-serif;
  --font-family-accent: 'Space Mono', monospace;
  
  --nav-height: 64px;
  --nav-bottom-height: 70px;
  --sidebar-width: 240px;
  --card-radius: 16px;
  
  --transition-fast: 0.15s ease;
  --transition-medium: 0.3s ease;
}

/* ====== DARK THEMES ====== */
[data-theme="dark-purple"] {
  --bg: #1a142b;
  --bg-secondary: #2d1f4a;
  --bg-card: #2d1f4a;
  --bg-nav: #2d1f4a;
  --text-primary: #e8d9ff;
  --text-secondary: #b8a5d6;
  --text-muted: #8a7aaa;
  --border-color: #4a3570;
  --shadow: rgba(0,0,0,0.4);
  --shadow-lg: rgba(0,0,0,0.6);
  --accent1: #FF6FA5;
  --accent2: #2EC4B6;
  --accent3: #FFD23F;
  --accent4: #8B7BF7;
  --danger: #e14b6a;
  --success: #4ade80;
  --warning: #fbbf24;
  --bg-warning: #4a3a1a;
  --input-bg: #3d2a5c;
  --modal-overlay: rgba(0,0,0,0.7);
  --tag-bg: #3d2a5c;
  --comment-bg: #3d2a5c;
}

/* ====== BG THEMES ====== */
.bg-none { background: var(--bg-secondary); }
.bg-starrynight {
  background: radial-gradient(circle at 15% 20%, #fff 1px, transparent 1.5px) 0 0/40px 40px,
              radial-gradient(circle at 60% 70%, #fff 1px, transparent 1.5px) 10px 15px/50px 50px,
              radial-gradient(circle at 80% 30%, #fff 1px, transparent 1.5px) 0 0/60px 60px,
              linear-gradient(160deg, #0b1237, #1c1750 60%, #3a2166);
}
.bg-sakura { background: linear-gradient(160deg, #ffe3ef, #ffc4dd 50%, #ffe9f4); }
.bg-cyber {
  background: repeating-linear-gradient(0deg, rgba(0,255,240,.15) 0 1px, transparent 1px 26px),
              repeating-linear-gradient(90deg, rgba(0,255,240,.15) 0 1px, transparent 1px 26px),
              linear-gradient(160deg, #0a0a1a, #170a2e);
}
.bg-meadow { background: linear-gradient(180deg, #bdeaff 0%, #bdeaff 55%, #c7f0a5 55%, #8fd67e 100%); }
.bg-deepsea {
  background: radial-gradient(circle at 30% 80%, rgba(255,255,255,.25) 0 4px, transparent 5px) 0 0/70px 70px,
              linear-gradient(180deg, #053a52, #012338);
}
.bg-sunset { background: linear-gradient(180deg, #3a1c5e 0%, #a8397a 40%, #f2765f 70%, #ffd27a 100%); }
.bg-cottoncandy { background: linear-gradient(120deg, #c9e7ff, #ffd6f0 45%, #e3d1ff); }
.bg-pride { background: linear-gradient(180deg, #ff5f6d 0 16.6%, #ff9a56 16.6% 33.2%, #ffd83f 33.2% 49.8%, #5ad18a 49.8% 66.4%, #4aa9ff 66.4% 83%, #a06bff 83% 100%); }

/* ====== RESET ====== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font-family-body);
  background: var(--bg);
  color: var(--text-primary);
  transition: background var(--transition-medium), color var(--transition-medium);
  -webkit-font-smoothing: antialiased;
}

/* ====== SCROLLBAR ====== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--accent4); border-radius: 3px; }

/* ====== APP CONTAINER ====== */
#app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ====== TOP BAR ====== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--bg-nav);
  border-bottom: 2px solid var(--border-color);
  height: var(--nav-height);
  flex-shrink: 0;
  z-index: 10;
  transition: background var(--transition-medium);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.brand-badge {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: conic-gradient(from 200deg, var(--accent1), var(--accent3), var(--accent2), var(--accent4), var(--accent1));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand h1 {
  font-size: 18px;
  margin: 0;
  line-height: 1.2;
  color: var(--text-primary);
}

.brand .tagline {
  font-size: 9px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  line-height: 1;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ====== SIDEBAR ====== */
.sidebar {
  display: none;
  position: fixed;
  top: var(--nav-height);
  left: 0;
  bottom: 0;
  width: var(--sidebar-width);
  background: var(--bg-nav);
  border-right: 2px solid var(--border-color);
  padding: 16px 12px;
  overflow-y: auto;
  z-index: 5;
  transition: background var(--transition-medium);
}

.sidebar.open { display: block; }

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.sidebar-nav button {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  border-radius: 12px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all var(--transition-fast);
  width: 100%;
  text-align: left;
  font-family: var(--font-family-body);
}

.sidebar-nav button:hover {
  background: var(--tag-bg);
  color: var(--text-primary);
}

.sidebar-nav button.active {
  background: var(--accent4);
  color: white;
  box-shadow: 0 2px 8px rgba(108, 92, 231, 0.3);
}

.sidebar-nav button .icon {
  font-size: 20px;
  width: 28px;
  text-align: center;
}

.sidebar-nav button .label {
  flex: 1;
}

.sidebar-user {
  margin-top: auto;
  padding-top: 16px;
  border-top: 2px solid var(--border-color);
}

.sidebar-user .user-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  border-radius: 12px;
  cursor: pointer;
  transition: background var(--transition-fast);
}

.sidebar-user .user-card:hover {
  background: var(--tag-bg);
}

.sidebar-user .avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--tag-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 14px;
  color: var(--accent4);
  flex-shrink: 0;
  background-size: cover;
  background-position: center;
}

.sidebar-user .user-info {
  flex: 1;
  min-width: 0;
}

.sidebar-user .user-info .name {
  font-weight: 700;
  font-size: 14px;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-user .user-info .pronouns {
  font-size: 12px;
  color: var(--text-secondary);
}

/* ====== MAIN CONTENT ====== */
.main-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 20px 100px;
  transition: padding var(--transition-medium);
  -webkit-overflow-scrolling: touch;
}

/* ====== BOTTOM NAV ====== */
.bottom-nav {
  display: flex;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--nav-bottom-height);
  background: var(--bg-nav);
  border-top: 2px solid var(--border-color);
  z-index: 10;
  padding: 4px 8px 8px;
  transition: background var(--transition-medium);
  justify-content: space-around;
  align-items: center;
}

.bottom-nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: none;
  border: none;
  padding: 6px 12px;
  border-radius: 12px;
  cursor: pointer;
  transition: all var(--transition-fast);
  color: var(--text-secondary);
  font-family: var(--font-family-body);
  font-size: 10px;
  font-weight: 600;
  min-width: 60px;
  position: relative;
}

.bottom-nav button .icon {
  font-size: 22px;
  line-height: 1;
}

.bottom-nav button .label {
  font-size: 9px;
}

.bottom-nav button.active {
  color: var(--accent4);
}

.bottom-nav button.active .icon {
  transform: scale(1.1);
}

.bottom-nav button .badge {
  position: absolute;
  top: 0;
  right: 4px;
  background: var(--danger);
  color: white;
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 999px;
  font-weight: 700;
  min-width: 18px;
  text-align: center;
}

/* ====== FAB ====== */
.fab {
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent4);
  color: white;
  border: none;
  box-shadow: 0 4px 16px rgba(108, 92, 231, 0.4);
  font-size: 28px;
  cursor: pointer;
  transition: all var(--transition-fast);
  z-index: 8;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
}

.fab:active {
  transform: scale(0.92);
}

/* ====== CARDS ====== */
.pinboard {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
  padding: 4px 0;
}

.pin-card {
  background: var(--bg-card);
  border-radius: var(--card-radius);
  padding: 12px 12px 16px;
  box-shadow: 0 2px 12px var(--shadow);
  cursor: pointer;
  transition: all var(--transition-fast);
  position: relative;
  touch-action: manipulation;
}

.pin-card:active {
  transform: scale(0.97);
}

.pin-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px var(--shadow-lg);
}

.pin-card .image-container {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 8px;
  background: var(--bg-secondary);
}

.pin-card .image-container img,
.pin-card .image-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.pin-card .cw-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(225, 75, 106, 0.9);
  color: white;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 700;
  backdrop-filter: blur(4px);
}

.pin-card h3 {
  margin: 10px 0 2px;
  font-size: 16px;
  font-weight: 700;
}

.pin-card .byline {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 600;
}

.pin-card .mini-tags {
  margin-top: 6px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.pin-card .mini-tags span {
  font-size: 10px;
  background: var(--tag-bg);
  color: var(--accent4);
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 700;
}

.pin-card .stats-row {
  display: flex;
  gap: 14px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 700;
}

/* ====== AUTH - FIXED FOR SCROLLING ====== */
.auth-wrap {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  height: 100vh;
  padding: 20px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.auth-box {
  background: var(--bg-card);
  border-radius: 24px;
  padding: 32px 28px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 4px 32px var(--shadow-lg);
  margin: 20px auto;
  flex-shrink: 0;
}

.auth-box .brand-center {
  text-align: center;
  margin-bottom: 20px;
}

.auth-box .brand-center .brand-badge {
  margin: 0 auto 8px;
  width: 56px;
  height: 56px;
  font-size: 24px;
}

.auth-box .brand-center h1 {
  font-size: 24px;
  margin: 0;
}

.auth-box .brand-center .subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 600;
  letter-spacing: 1px;
}

.auth-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.auth-tabs button {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  border: none;
  font-weight: 700;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
  font-family: var(--font-family-body);
  font-size: 14px;
}

.auth-tabs button.active {
  background: var(--accent4);
  color: white;
}

/* ====== FORMS ====== */
label {
  font-weight: 700;
  font-size: 13px;
  color: var(--text-secondary);
  display: block;
  margin: 14px 0 5px;
}

input, textarea, select {
  width: 100%;
  padding: 11px 14px;
  border-radius: 12px;
  border: 2px solid var(--border-color);
  font-family: var(--font-family-body);
  font-size: 14px;
  color: var(--text-primary);
  background: var(--input-bg);
  transition: border-color var(--transition-fast);
  -webkit-appearance: none;
  appearance: none;
}

input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--accent4);
  box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
}

textarea {
  resize: vertical;
  min-height: 80px;
}

/* ====== BUTTONS ====== */
.btn {
  border: none;
  border-radius: 12px;
  padding: 11px 20px;
  font-weight: 700;
  font-size: 14px;
  color: white;
  background: var(--accent1);
  cursor: pointer;
  transition: all var(--transition-fast);
  font-family: var(--font-family-body);
  touch-action: manipulation;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn:active {
  transform: scale(0.97);
}

.btn.secondary {
  background: var(--accent2);
}

.btn.purple {
  background: var(--accent4);
}

.btn.ghost {
  background: transparent;
  color: var(--text-primary);
  border: 2px solid var(--border-color);
}

.btn.danger {
  background: var(--danger);
}

.btn.small {
  padding: 6px 14px;
  font-size: 12px;
  border-radius: 8px;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ====== NOTIFICATION PANEL ====== */
.notification-panel {
  position: fixed;
  top: 72px;
  right: 16px;
  width: 360px;
  max-height: 400px;
  overflow-y: auto;
  background: var(--bg-card);
  border-radius: 16px;
  box-shadow: 0 8px 40px var(--shadow-lg);
  padding: 16px;
  z-index: 50;
  border: 2px solid var(--border-color);
  animation: slideDown 0.2s ease;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}

.notification-panel .panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border-color);
}

.notification-panel .panel-header h3 {
  font-size: 16px;
  margin: 0;
}

.notification-panel .panel-header .close-panel {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-secondary);
  padding: 0 4px;
}

.notification-item {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-color);
  font-size: 13px;
  position: relative;
}

.notification-item:last-child {
  border-bottom: none;
}

.notification-item .notif-time {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.notification-item .dismiss-notif {
  position: absolute;
  top: 8px;
  right: 8px;
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 6px;
  border-radius: 4px;
}

.notification-item .dismiss-notif:hover {
  background: var(--danger);
  color: white;
}

/* ============================================================
   ====== BEAUTIFUL COMMENT SECTION ======
   ============================================================ */

.comments-section {
  margin-top: 22px;
  border-top: 2px solid var(--border-color);
  padding-top: 16px;
}

.comments-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.comments-header h3 {
  font-size: 16px;
  font-weight: 700;
  margin: 0;
}

.comments-header .comment-count {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 600;
}

/* Comment Input Area */
.comment-input-wrapper {
  background: var(--bg-secondary);
  border-radius: 16px;
  border: 2px solid var(--border-color);
  padding: 12px 16px;
  margin-bottom: 16px;
  transition: border-color var(--transition-fast);
}

.comment-input-wrapper:focus-within {
  border-color: var(--accent4);
  box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
}

.comment-input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

.comment-input-row .comment-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--tag-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  color: var(--accent4);
  flex-shrink: 0;
}

.comment-input-row textarea {
  flex: 1;
  border: none;
  background: transparent;
  padding: 4px 0;
  resize: none;
  font-size: 14px;
  line-height: 1.5;
  min-height: 36px;
  max-height: 100px;
  font-family: var(--font-family-body);
  color: var(--text-primary);
}

.comment-input-row textarea:focus {
  box-shadow: none;
  outline: none;
}

.comment-input-row .comment-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.comment-input-row .comment-actions button {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 8px;
  transition: all var(--transition-fast);
  color: var(--text-secondary);
  touch-action: manipulation;
}

.comment-input-row .comment-actions button:hover {
  background: var(--tag-bg);
  transform: scale(1.1);
}

.comment-input-row .comment-actions button:active {
  transform: scale(0.9);
}

.comment-input-row .comment-actions .send-btn {
  background: var(--accent4);
  color: white;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  padding: 0;
}

.comment-input-row .comment-actions .send-btn:hover {
  background: var(--accent1);
  transform: scale(1.05);
}

/* Sticker/Emoji Picker Row */
.comment-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border-color);
}

.comment-toolbar .toolbar-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 6px;
  transition: all var(--transition-fast);
  touch-action: manipulation;
}

.comment-toolbar .toolbar-btn:hover {

  const screenHeight = window.screen.height;
  const heightRatio = windowHeight / screenHeight;
  const keyboardLikelyOpen = heightRatio < 0.7 && windowHeight < 800;
  
  const newState = isInputFocused || keyboardLikelyOpen;
  
  if (newState !== isKeyboardOpen) {
    isKeyboardOpen = newState;
    document.body.classList.toggle('keyboard-open', isKeyboardOpen);
  }
}

document.addEventListener('focusin', () => setTimeout(detectKeyboard, 100));
document.addEventListener('focusout', () => setTimeout(detectKeyboard, 300));

let lastHeight = window.innerHeight;
window.addEventListener('resize', () => {
  const currentHeight = window.innerHeight;
  if (Math.abs(currentHeight - lastHeight) > 100) {
    setTimeout(detectKeyboard, 200);
  }
  lastHeight = currentHeight;
  isDesktop = window.innerWidth >= 768;
});

// ====== UTILITY ======
function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }

function timeAgo(date) {
  const now = new Date();
  const diff = now - new Date(date);
  const seconds = Math.floor(diff / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const days = Math.floor(hours / 24);
  const weeks = Math.floor(days / 7);
  const months = Math.floor(days / 30);
  const years = Math.floor(days / 365);

  if (seconds < 60) return 'just now';
  if (minutes < 60) return minutes + 'm ago';
  if (hours < 24) return hours + 'h ago';
  if (days < 7) return days + 'd ago';
  if (weeks < 4) return weeks + 'w ago';
  if (months < 12) return months + 'mo ago';
  return years + 'y ago';
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) + ' at ' +
    d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return h; }
function cardRotation(id) { return (Math.abs(hashStr(id)) % 5) - 2; }
function simpleObscure(pw) { return btoa(unescape(encodeURIComponent('salt-oc-haven::' + pw))); }
function uid() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }

function isVideo(url) { return /\.(mp4|webm|ogg|mov|avi|mkv)$/i.test(url) || (url && url.startsWith('data:video')); }
function isGif(url) { return /\.gif$/i.test(url) || (url && url.startsWith('data:image/gif')); }
function isImage(url) { return /\.(png|jpg|jpeg|webp|bmp|svg)$/i.test(url) || url.startsWith('data:image/'); }

// ====== STORAGE ======
async function sGet(key) {
  try {
    if (window.storage && typeof window.storage.get === 'function') {
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : null;
    }
    const item = localStorage.getItem(key);
    return item ? JSON.parse(item) : null;
  } catch (e) { return null; }
}

async function sSet(key, val) {
  try {
    if (window.storage && typeof window.storage.set === 'function') {
      return window.storage.set(key, JSON.stringify(val), true);
    }
    localStorage.setItem(key, JSON.stringify(val));
    return true;
  } catch (e) { return null; }
}

async function sDelete(key) {
  try {
    if (window.storage && typeof window.storage.delete === 'function') {
      return await window.storage.delete(key, true);
    }
    localStorage.removeItem(key);
    return true;
  } catch (e) { return null; }
}

async function sList(prefix) {
  try {
    if (window.storage && typeof window.storage.list === 'function') {
      const r = await window.storage.list(prefix, true);
      return r ? r.keys : [];
    }
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) keys.push(k);
    }
    return keys;
  } catch (e) { return []; }
}

async function addNotificationForUser(userEmail, message, type = 'info') {
  if (!userEmail) return;
  const key = 'notifications:' + userEmail;
  let userNotifs = await sGet(key) || [];
  userNotifs.unshift({ id: uid(), message, type, date: new Date().toISOString(), read: false });
  if (userNotifs.length > 100) userNotifs.pop();
  await sSet(key, userNotifs);
  if (currentUser && userEmail === currentUser.email) {
    notifications = userNotifs;
    if (notificationPanelOpen) render();
  }
}

async function loadNotificationsForUser(email) {
  if (!email) return [];
  const key = 'notifications:' + email;
  return await sGet(key) || [];
}

async function deleteNotification(userEmail, notificationId) {
  if (!userEmail || !notificationId) return;
  const key = 'notifications:' + userEmail;
  let userNotifs = await sGet(key) || [];
  userNotifs = userNotifs.filter(n => n.id !== notificationId);
  await sSet(key, userNotifs);
  if (currentUser && userEmail === currentUser.email) {
    notifications = userNotifs;
    render();
  }
}

async function clearAllNotifications(userEmail) {
  if (!userEmail) return;
  const key = 'notifications:' + userEmail;
  await sSet(key, []);
  if (currentUser && userEmail === currentUser.email) {
    notifications = [];
    render();
  }
}

}

function getFilteredFeed() {
  let results = [...feedCache];
  if (feedSearchQuery) {
    const q = feedSearchQuery.toLowerCase();
    results = results.filter(oc =>
      (oc.name || '').toLowerCase().includes(q) ||
      (oc.ownerName || '').toLowerCase().includes(q) ||
      (oc.pronouns || '').toLowerCase().includes(q) ||
      (oc.gender || '').toLowerCase().includes(q) ||
      (oc.desc || '').toLowerCase().includes(q) ||
      (oc.tags || []).some(t => t.toLowerCase().includes(q))
    );
  }
  if (feedFilterMode === 'nsfw') results = results.filter(oc => oc.contentWarning);
  else if (feedFilterMode === 'sfw') results = results.filter(oc => !oc.contentWarning);

  if (feedSortMode === 'newest') results.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  else if (feedSortMode === 'oldest') results.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  else if (feedSortMode === 'popular') results.sort((a, b) => (b.likes || []).length - (a.likes || []).length);
  else if (feedSortMode === 'mostcommented') results.sort((a, b) => (b.comments || []).length - (a.comments || []).length);
  return results;
}

function getOCRelationships(oc) {
  const rels = [];
  if (oc && oc.relationships) {
    for (const rel of oc.relationships) {
      const target = feedCache.find(o => o.id === rel.targetId);
      if (target) rels.push({ ...rel, target });
    }
  }
  return rels;
}

function getCommentReactions(comment) {
  if (!comment.reactions) return {};
  return comment.reactions;
}

function toggleCommentReaction(comment, emoji) {
  if (!comment.reactions) comment.reactions = {};
  const key = emoji;
  if (!comment.reactions[key]) comment.reactions[key] = [];
  const userIndex = comment.reactions[key].indexOf(currentUser.email);
  if (userIndex >= 0) {
    comment.reactions[key].splice(userIndex, 1);
    if (comment.reactions[key].length === 0) {
      delete comment.reactions[key];
    }
  } else {
    comment.reactions[key].push(currentUser.email);
  }
  return comment;
}

function toggleCommentLike(comment) {
  if (!comment.likes) comment.likes = [];
  const idx = comment.likes.indexOf(currentUser.email);
  if (idx >= 0) {
    comment.likes.splice(idx, 1);
  } else {
    comment.likes.push(currentUser.email);
  }
  return comment;
}

// ====== FILE HANDLING ======
function fileToResizedDataURL(file, maxDim) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    if (file.size > 10 * 1024 * 1024) {
      reject(new Error('File too large (max 10MB).'));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      if (file.type.startsWith('video/')) {
        resolve(reader.result);
        return;
      }
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width);
            width = maxDim; } else { width = Math.round(width * maxDim / height);
            height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => {
        if (file.type === 'image/gif' || file.type === 'image/webp') {
          resolve(reader.result);
        } else {
          reject(new Error('Could not read that image file.'));
        }
      };
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('Could not read that file.'));
    reader.readAsDataURL(file);
  });
}

function renderBeautifulComments(oc) {
  const comments = oc.comments || [];

  let html = `

      <div class="comments-header">
        <h3>💬 Comments</h3>

  // Comment input
  html += `
    <div class="comment-input-wrapper">
      <div class="comment-input-row">
        <div class="comment-avatar" style="${currentUser.avatar ? `background-image:url(${currentUser.avatar});background-size:cover;` : ''}">
          ${currentUser.avatar ? '' : esc((currentUser.displayName || 'P').slice(0, 1))}
        </div>
        <textarea id="comment-textarea" rows="1" placeholder="Write a comment..." maxlength="500"></textarea>
        <div class="comment-actions">
          <button class="send-btn" id="send-comment-btn" title="Send comment">➤</button>
        </div>
      </div>
      <div class="comment-toolbar">
        ${EMOJI_REACTIONS.slice(0, 8).map(emoji => `
          <button class="toolbar-btn" data-emoji="${esc(emoji)}" title="${esc(emoji)}">${emoji}</button>
        `).join('')}
        <span style="color:var(--text-muted);font-size:12px;padding:0 4px;">|</span>
        ${stickerLibCache.slice(0, 6).map(s => `
          <img class="sticker-preview" src="${s}" data-sticker="${esc(s)}" title="Insert sticker">
        `).join('')}
        ${stickerLibCache.length > 6 ? `<span style="color:var(--text-muted);font-size:11px;">+${stickerLibCache.length - 6} more</span>` : ''}
      </div>
    </div>
  `;

  // Comments list
  if (comments.length === 0) {
    html += `<p style="color:var(--text-secondary);font-size:14px;padding:20px 0;text-align:center;">No comments yet — be the first to say something! 💬</p>`;
  } else {
    html += `<div class="comments-list">`;
    comments.forEach((comment, idx) => {
      html += renderCommentItem(comment, idx, oc);
    });
    html += `</div>`;
  }

  html += `</div>`;
  return html;

function renderCommentItem(comment, idx, oc) {
  const isOwner = currentUser && comment.email === currentUser.email;
  const isOCOwner = currentUser && oc.owner === currentUser.email;
  const reactions = comment.reactions || {};
  const likes = comment.likes || [];
  const likedByUser = likes.includes(currentUser?.email);
  const commentText = comment.text || '';
  const avatarLetter = (comment.name || 'U').slice(0, 1);
  
  // Check for sticker in comment
  let displayText = commentText;
  let stickerHtml = '';
  const stickerMatch = commentText.match(/!\[sticker\]\(([^)]+)\)/);
  if (stickerMatch) {
    stickerHtml = `<img src="${stickerMatch[1]}" class="sticker-inline" alt="sticker">`;
    displayText = commentText.replace(/!\[sticker\]\([^)]+\)/, '').trim();
  }

  // Check for GIF
  const gifMatch = commentText.match(/!\[gif\]\(([^)]+)\)/);
  if (gifMatch) {
    stickerHtml = `<img src="${gifMatch[1]}" class="sticker-inline" alt="gif" style="max-width:120px;max-height:120px;">`;
    displayText = commentText.replace(/!\[gif\]\([^)]+\)/, '').trim();
  }

  let html = `
    <div class="comment-item" data-comment-idx="${idx}">
      <div class="comment-avatar-lg" style="${comment.avatar ? `background-image:url(${comment.avatar});background-size:cover;` : ''}">
        ${comment.avatar ? '' : esc(avatarLetter)}
      </div>
      <div class="comment-content">
        <div class="comment-author">
          <span class="name">${esc(comment.name)}</span>
          ${isOCOwner && comment.email === oc.owner ? `<span class="badge-owner">Creator</span>` : ''}
          ${isOwner ? `<span class="badge-owner" style="background:var(--accent2);">You</span>` : ''}
          <span class="time">${timeAgo(comment.date)}</span>
        </div>
        <div class="comment-text">
          ${displayText ? nl2br(displayText) : ''}
          ${stickerHtml}
        </div>
        <div class="comment-actions-row">
          <button class="like-btn ${likedByUser ? 'active' : ''}" data-comment-like="${idx}">
            ${likedByUser ? '❤️' : '🤍'} ${likes.length > 0 ? likes.length : ''}
          </button>
          <button class="reply-btn" data-comment-reply="${idx}">Reply</button>
          ${isOwner ? `<button class="delete-btn" data-comment-delete="${idx}" style="color:var(--danger);">Delete</button>` : ''}
        </div>
        
        <!-- Comment Reactions -->
        <div class="comment-reactions">
          ${EMOJI_REACTIONS.slice(0, 8).map(emoji => {
            const users = reactions[emoji] || [];
            const count = users.length;
            const hasReacted = users.includes(currentUser?.email);
            return `
              <span class="comment-reaction ${hasReacted ? 'active' : ''}" data-comment-reaction="${idx}" data-reaction-emoji="${emoji}">
                ${emoji}
                ${count > 0 ? `<span class="reaction-count">${count}</span>` : ''}
              </span>
            `;
          }).join('')}
          ${Object.keys(reactions).length > 8 ? `<span style="font-size:12px;color:var(--text-muted);">+${Object.keys(reactions).length - 8}</span>` : ''}
        </div>
        
        <!-- Reply Form (hidden by default) -->
        <div class="comment-reply-form" id="reply-form-${idx}" style="display:none;">
          <input type="text" placeholder="Write a reply..." class="reply-input" data-reply-to="${idx}">
          <button class="send-reply-btn" data-reply-to="${idx}">Reply</button>
          <button class="cancel-reply-btn" data-reply-to="${idx}" style="background:transparent;color:var(--text-secondary);">Cancel</button>
        </div>
      </div>
    </div>
  `;

  return html;
}

// ====== HANDLERS ======
function attachHandlers() {
  // Auth handlers
  if (screen === 'auth') {
    document.querySelectorAll('[data-auth-tab]').forEach(b => {
      b.onclick = () => {
        authMode = b.dataset.authTab;
        authError = '';
        authSuccess = '';
        render();
      };
    });

    const loginForm = document.getElementById('login-form');
    if (loginForm) loginForm.onsubmit = handleLogin;

    const signupForm = document.getElementById('signup-form');
    if (signupForm) signupForm.onsubmit = handleSignupRequest;
    return;
  }

  // Navigation
  document.querySelectorAll('[data-tab]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const newTab = b.dataset.tab;
      if (newTab === 'myocs') await loadMyOCs();
      if (newTab === 'stickers') stickerLibCache = await loadStickerLib();
      tab = newTab;
      editingOC = null;
      ocFormError = '';
      render();
    };
  });

  // Brand click
  const brandToggle = document.getElementById('brand-toggle');
  if (brandToggle) {
    brandToggle.onclick = () => {
      tab = 'feed';
      render();
    };
  }

  // Notification bell
  const notifBell = document.getElementById('notif-bell');
  if (notifBell) {
    const newBell = notifBell.cloneNode(true);
    notifBell.parentNode.replaceChild(newBell, notifBell);
    newBell.onclick = (e) => {
      e.stopPropagation();
      notificationPanelOpen = !notificationPanelOpen;
      if (notificationPanelOpen) {
        notifications.forEach(n => n.read = true);
        if (currentUser) {
          const key = 'notifications:' + currentUser.email;
          sSet(key, notifications);
        }
      }
      render();
    };
  }

  // Close notification panel
  const closePanel = document.getElementById('close-notif-panel');
  if (closePanel) {
    closePanel.onclick = (e) => {
      e.stopPropagation();
      notificationPanelOpen = false;
      render();
    };
  }

  // Dismiss notification
  document.querySelectorAll('.dismiss-notif').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const id = btn.dataset.notifId;
      if (id && currentUser) {
        await deleteNotification(currentUser.email, id);
        notifications = await loadNotificationsForUser(currentUser.email);
        render();
      }
    };
  });

  // Clear all notifications
  const clearNotifs = document.getElementById('clear-notifs');
  if (clearNotifs) {
    clearNotifs.onclick = async (e) => {
      e.stopPropagation();
      if (currentUser) {
        await clearAllNotifications(currentUser.email);
        notifications = [];
        render();
      }
    };
  }

  // Click outside notification panel
  document.addEventListener('click', (e) => {
    const panel = document.getElementById('notif-panel');
    const bell = document.getElementById('notif-bell');
    if (notificationPanelOpen && panel && bell) {
      if (!panel.contains(e.target) && !bell.contains(e.target)) {
        notificationPanelOpen = false;
        render();
      }
    }
  });

  // Logout
  const logoutBtn = document.getElementById('logout-btn');
  if (logoutBtn) {
    logoutBtn.onclick = () => {
      currentUser = null;
      screen = 'auth';
      authMode = 'login';
      authError = '';
      authSuccess = 'You have been logged out.';
      localStorage.removeItem('lastUser');
      render();
    };
  }

  // FAB
  const fab = document.getElementById('fab-btn');
  if (fab) {
    fab.onclick = () => {
      editingOC = null;
      formStickerLayers = [];
      formImages = [];
      formBgTheme = 'none';
      selectedStickerId = null;
      selectedPronoun = '';
      selectedGender = '';
      ocFormError = '';
      tab = 'oc-form';
      render();
    };
  }

  // New OC button
  const newOcBtn = document.getElementById('new-oc-btn');
  if (newOcBtn) {
    newOcBtn.onclick = () => {
      editingOC = null;
      formStickerLayers = [];
      formImages = [];
      formBgTheme = 'none';
      selectedStickerId = null;
      selectedPronoun = '';
      selectedGender = '';
      ocFormError = '';
      tab = 'oc-form';
      render();
    };
  }

  // Feed controls
  wireFeedControls();

  // Feed cards - FIXED: Use proper click handling
  document.querySelectorAll('[data-open-oc]').forEach(el => {
    el.onclick = function(e) {
      e.preventDefault();
      e.stopPropagation();
      const ocId = this.dataset.openOc;
      const oc = feedCache.find(o => o.id === ocId);
      if (oc) { 
        openOC = oc; 
        renderModalOnly(); 
      }
      return false;
    };
  });

  // Edit OC
  document.querySelectorAll('[data-edit-oc]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const oc = feedCache.find(o => o.id === el.dataset.editOc);
      if (!oc) return;
      editingOC = oc;
      formStickerLayers = oc.stickerLayers ? oc.stickerLayers.map(l => ({ ...l })) : [];
      formImages = oc.images ? [...oc.images] : [];
      formBgTheme = oc.bgTheme || 'none';
      selectedStickerId = null;
      selectedPronoun = oc.pronouns || '';
      selectedGender = oc.gender || '';
      ocFormError = '';
      tab = 'oc-form';
      render();
    };
  });

  // OC Form
  const ocForm = document.getElementById('oc-form');
  if (ocForm) {
    setupChipHandlers();

    document.querySelectorAll('#bg-swatches .bg-swatch').forEach(sw => {
      sw.onclick = (e) => {
        e.stopPropagation();
        formBgTheme = sw.dataset.bg;
        document.querySelectorAll('#bg-swatches .bg-swatch').forEach(s => s.classList.remove('selected'));
        sw.classList.add('selected');
      };
    });

    document.querySelectorAll('[data-sticker-add]').forEach(slot => {
      slot.onclick = (e) => {
        e.stopPropagation();
        if (formStickerLayers.length >= 10) {
          ocFormError = 'Maximum 10 stickers allowed.';
          render();
          return;
        }
        const val = slot.dataset.stickerAdd;
        if (formStickerLayers.some(l => l.src === val)) {
          ocFormError = 'This sticker is already added!';
          render();
          return;
        }
        formStickerLayers.push({ 
          id: uid(), 
          src: val, 
          x: 30 + Math.random() * 40, 
          y: 20 + Math.random() * 40 
        });
        selectedStickerId = formStickerLayers[formStickerLayers.length - 1].id;
        ocFormError = '';
        render();
      };
    });

    const imgInput = document.getElementById('oc-image-input');
    if (imgInput) {
      imgInput.onchange = async () => {
        try {
          const files = imgInput.files;
          for (const file of files) {
            const dataUrl = await fileToResizedDataURL(file, 700);
            if (dataUrl) formImages.push(dataUrl);
          }
          imgInput.value = '';
          render();
        } catch (e) {
          ocFormError = e.message;
          render();
        }
      };
    }

    document.querySelectorAll('[data-remove-image]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const i = parseInt(btn.dataset.removeImage, 10);
        if (!isNaN(i) && i >= 0 && i < formImages.length) {
          formImages.splice(i, 1);
          render();
        }
      };
    });

    ocForm.onsubmit = handleOCFormSubmit;

    const cancelBtn = document.getElementById('cancel-oc-form');
    if (cancelBtn) {
      cancelBtn.onclick = (e) => {
        e.stopPropagation();
        tab = 'myocs';
        editingOC = null;
        formStickerLayers = [];
        formImages = [];
        formBgTheme = 'none';
        selectedPronoun = '';
        selectedGender = '';
        render();
      };
    }
  }

  // Sticker upload
  const stickerUpload = document.getElementById('sticker-upload');
  if (stickerUpload) {
    stickerUpload.onchange = async () => {
      try {
        const dataUrl = await fileToResizedDataURL(stickerUpload.files[0], 220);
        if (dataUrl) {
          stickerLibCache.push(dataUrl);
          await sSet('stickers:' + currentUser.email, stickerLibCache);
          render();
        }
      } catch (e) { alert(e.message); }
    };
  }

  document.querySelectorAll('[data-del-sticker]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.delSticker, 10);
      if (!isNaN(i) && i >= 0 && i < stickerLibCache.length) {
        stickerLibCache.splice(i, 1);
        await sSet('stickers:' + currentUser.email, stickerLibCache);
        render();
      }
    };
  });

  // Profile form
  const profileForm = document.getElementById('profile-form');
  if (profileForm) {
    setupChipHandlers();
    profileForm.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(profileForm);
      currentUser.displayName = fd.get('displayName').trim();
      currentUser.pronouns = fd.get('pronouns').trim();
      currentUser.gender = fd.get('gender').trim();
      currentUser.bio = fd.get('bio').trim();
      await sSet('user:' + currentUser.email, currentUser);
      for (const oc of feedCache.filter(o => o.owner === currentUser.email)) {
        oc.ownerName = currentUser.displayName;
        await sSet('oc:' + oc.id, oc);
      }
      await loadFeed();
      const savedMsg = document.getElementById('profile-saved');
      if (savedMsg) savedMsg.style.display = 'inline';
      setTimeout(render, 700);
    };
  }

  // Theme selection
  document.querySelectorAll('[data-theme]').forEach(sw => {
    sw.onclick = async (e) => {
      e.stopPropagation();
      const key = sw.dataset.theme;
      currentUser.themePref = key;
      applyTheme(key);
      await sSet('user:' + currentUser.email, currentUser);
      render();
    };
  });

  // Font selection
  document.querySelectorAll('[data-font]').forEach(fontOption => {
    fontOption.onclick = async (e) => {
      e.stopPropagation();
      const fontId = fontOption.dataset.font;
      document.querySelectorAll('[data-font]').forEach(f => f.classList.remove('active'));
      fontOption.classList.add('active');
      applyFont(fontId);
      if (currentUser) {
        currentUser.fontPref = fontId;
        await sSet('user:' + currentUser.email, currentUser);
      }
      render();
    };
  });

  renderModalOnly();
}

// ====== MODAL RENDER - FIXED WITH IMAGES ======
function renderModalOnly() {
  // Remove existing modal first - CLEANUP
  const existing = document.getElementById('modal-backdrop');
  if (existing) {
    existing.remove();
  }
  if (!openOC) return;

  const oc = openOC;
  const isOwner = currentUser && oc.owner === currentUser.email;
  const liked = currentUser && (oc.likes || []).includes(currentUser.email);
  const relationships = getOCRelationships(oc);
  
  // FIX: Better image handling
  let allImages = [];
  if (oc.images && oc.images.length > 0) {
    allImages = [...oc.images];
  } else if (oc.image) {
    allImages = [oc.image];
  }
  
  // If still no images, check if there's a single image property
  if (allImages.length === 0 && oc.image) {
    allImages = [oc.image];
  }

  const wrapper = document.createElement('div');
  wrapper.innerHTML = `
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <button class="modal-close" id="close-modal">✕</button>
      <div class="modal-body" style="margin-top:0;padding-top:20px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
          <h2 style="margin:0;font-size:24px;">${esc(oc.name)} ${oc.contentWarning ? '⚠️' : ''}</h2>
          ${isOwner ? `
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn small" id="edit-oc-btn">Edit</button>
              <button class="btn small danger" id="delete-oc-btn">Delete</button>
            </div>` : ''}
        </div>
        <div style="font-size:13px;color:var(--text-secondary);font-weight:600;">Created by ${esc(oc.ownerName)}</div>
        <div style="margin-top:6px;">
          ${oc.pronouns ? `<span style="display:inline-block;background:var(--tag-bg);color:var(--accent4);font-weight:700;font-size:12px;padding:4px 11px;border-radius:999px;margin:4px 6px 0 0;">${esc(oc.pronouns)}</span>` : ''}
          ${oc.gender ? `<span style="display:inline-block;background:var(--tag-bg);color:var(--accent4);font-weight:700;font-size:12px;padding:4px 11px;border-radius:999px;margin:4px 6px 0 0;">${esc(oc.gender)}</span>` : ''}
          ${oc.tags ? oc.tags.map(t => `<span style="display:inline-block;background:var(--tag-bg);color:var(--accent4);font-weight:700;font-size:12px;padding:4px 11px;border-radius:999px;margin:4px 6px 0 0;">#${esc(t)}</span>`).join('') : ''}
        </div>
        ${relationships.length ? `
          <div style="margin:6px 0;">
            ${relationships.map(r => `
              <span style="background:var(--accent4);color:white;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block;margin:2px;">${esc(r.type)}: ${esc(r.target.name)}</span>
            `).join('')}
          </div>` : ''}
        <div><span style="font-family:'Space Mono',monospace;font-size:11px;color:var(--text-secondary);display:inline-block;background:var(--tag-bg);padding:3px 10px;border-radius:6px;margin-top:6px;">📌 posted ${formatDate(oc.createdAt)}</span></div>
        
        <!-- FIXED: Image display section -->
        ${allImages.length > 0 ? `
          <div style="margin-top:12px;border-radius:12px;overflow:hidden;background:var(--bg-secondary);border:2px solid var(--border-color);">
            ${allImages.length === 1 ? `
              <div style="width:100%;max-height:400px;display:flex;align-items:center;justify-content:center;background:var(--bg-secondary);">
                ${isVideo(allImages[0]) ? 
                  `<video src="${allImages[0]}" controls style="max-width:100%;max-height:400px;object-fit:contain;"></video>` : 
                  `<img src="${allImages[0]}" style="max-width:100%;max-height:400px;object-fit:contain;display:block;">`}
              </div>
            ` : `
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:12px;">
                ${allImages.map(src => `
                  <div style="border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--bg-secondary);border:2px solid var(--border-color);">
                    ${isVideo(src) ? 
                      `<video src="${src}" muted playsinline style="width:100%;height:100%;object-fit:cover;"></video>` : 
                      `<img src="${src}" style="width:100%;height:100%;object-fit:cover;">`}
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        ` : `
          <div style="margin-top:12px;padding:40px;text-align:center;background:var(--bg-secondary);border-radius:12px;border:2px dashed var(--border-color);">
            <span style="font-size:48px;">🎨</span>
            <p style="color:var(--text-secondary);font-weight:600;margin-top:8px;">No image uploaded</p>
          </div>
        `}
        
        <div style="background:var(--bg-secondary);border-radius:14px;padding:16px 18px;margin-top:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;">${nl2br(oc.desc)}</div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;">
          <button class="btn like-btn ${liked ? 'liked' : ''}" id="like-btn" style="border:none;background:${liked ? 'var(--danger)' : 'var(--bg-secondary)'};color:${liked ? 'white' : 'var(--danger)'};font-weight:800;padding:9px 18px;border-radius:999px;font-size:14px;box-shadow:0 3px 0 var(--shadow);cursor:pointer;">❤️ ${liked ? 'Liked' : 'Like'} (${(oc.likes || []).length})</button>
          ${oc.contentWarning ? `<span style="color:var(--danger);font-weight:700;">⚠️ This post has a content warning</span>` : ''}
        </div>
        
        <!-- BEAUTIFUL COMMENTS SECTION -->
        ${renderBeautifulComments(oc)}
        
      </div>
    </div>
  </div>`;

  document.body.appendChild(wrapper.firstElementChild);

  // --- MODAL EVENT HANDLERS ---

  // Close modal - FIXED
  const closeBtn = document.getElementById('close-modal');
  if (closeBtn) {
    closeBtn.onclick = function(e) {
      e.preventDefault();
      openOC = null;
      renderModalOnly();
      return false;
    };
  }
  
  // Backdrop click - FIXED
  const backdrop = document.getElementById('modal-backdrop');
  if (backdrop) {
    backdrop.onclick = function(e) {
      if (e.target === this) {
        openOC = null;
        renderModalOnly();
      }
    };
  }

  // --- COMMENT INPUT HANDLERS ---

  // Auto-resize textarea
  const textarea = document.getElementById('comment-textarea');
  if (textarea) {
    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
    });
    
    // Enter to submit (Shift+Enter for new line)
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitComment();
      }
    });
  }

  // Emoji toolbar buttons
  document.querySelectorAll('[data-emoji]').forEach(btn => {
    btn.onclick = () => {
      const emoji = btn.dataset.emoji;
      if (textarea) {
        const cursor = textarea.selectionStart;
        const text = textarea.value;
        textarea.value = text.slice(0, cursor) + emoji + text.slice(cursor);
        textarea.focus();
        textarea.dispatchEvent(new Event('input'));
      }
    };
  });

  // Sticker toolbar buttons
  document.querySelectorAll('[data-sticker]').forEach(btn => {
    btn.onclick = () => {
      const stickerUrl = btn.dataset.sticker;
      if (textarea) {
        // Insert sticker as markdown image
        const cursor = textarea.selectionStart;
        const text = textarea.value;
        const stickerMarkdown = ` ![sticker](${stickerUrl}) `;
        textarea.value = text.slice(0, cursor) + stickerMarkdown + text.slice(cursor);
        textarea.focus();
        textarea.dispatchEvent(new Event('input'));
      }
    };
  });

  // Send comment
  const sendBtn = document.getElementById('send-comment-btn');
  if (sendBtn) {
    sendBtn.onclick = submitComment;
  }

  // --- COMMENT REACTION HANDLERS ---
  document.querySelectorAll('[data-comment-reaction]').forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation();
      const idx = parseInt(el.dataset.commentReaction);
      const emoji = el.dataset.reactionEmoji;
      if (isNaN(idx) || !emoji || !openOC) return;
      
      const comment = openOC.comments[idx];
      if (!comment) return;
      
      toggleCommentReaction(comment, emoji);
      await sSet('oc:' + openOC.id, openOC);
      await loadFeed();
      openOC = feedCache.find(o => o.id === openOC.id);
      renderModalOnly();
    };
  });

  // --- COMMENT LIKE HANDLERS ---
  document.querySelectorAll('[data-comment-like]').forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation();
      const idx = parseInt(el.dataset.commentLike);
      if (isNaN(idx) || !openOC) return;
      
      const comment = openOC.comments[idx];
      if (!comment) return;
      
      toggleCommentLike(comment);
      await sSet('oc:' + openOC.id, openOC);
      await loadFeed();
      openOC = feedCache.find(o => o.id === openOC.id);
      renderModalOnly();
    };
  });

  // --- REPLY BUTTON HANDLERS ---
  document.querySelectorAll('[data-comment-reply]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const idx = parseInt(el.dataset.commentReply);
      const replyForm = document.getElementById(`reply-form-${idx}`);
      if (replyForm) {
        replyForm.style.display = replyForm.style.display === 'none' ? 'flex' : 'none';
        const input = replyForm.querySelector('.reply-input');
        if (input) setTimeout(() => input.focus(), 100);
      }
    };
  });

  // --- SEND REPLY HANDLERS ---
  document.querySelectorAll('.send-reply-btn').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.replyTo);
      const replyForm = document.getElementById(`reply-form-${idx}`);
      const input = replyForm?.querySelector('.reply-input');
      if (!input || !input.value.trim()) return;
      
      const replyText = input.value.trim();
      const parentComment = openOC.comments[idx];
      if (!parentComment) return;
      
      // Add reply as a new comment with reference
      if (!openOC.comments) openOC.comments = [];
      openOC.comments.push({
        email: currentUser.email,
        name: currentUser.displayName,
        text: `↳ @${parentComment.name}: ${replyText}`,
        date: new Date().toISOString(),
        reactions: {},
        likes: [],
        parentId: idx
      });
      
      await sSet('oc:' + openOC.id, openOC);
      await loadFeed();
      openOC = feedCache.find(o => o.id === openOC.id);
      renderModalOnly();
    };
  });

  // --- CANCEL REPLY HANDLERS ---
  document.querySelectorAll('.cancel-reply-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.replyTo);
      const replyForm = document.getElementById(`reply-form-${idx}`);
      if (replyForm) replyForm.style.display = 'none';
    };
  });

  // --- DELETE COMMENT HANDLERS ---
  document.querySelectorAll('[data-comment-delete]').forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation();
      const idx = parseInt(el.dataset.commentDelete);
      if (isNaN(idx) || !openOC) return;
      
      if (!confirm('Delete this comment?')) return;
      
      openOC.comments.splice(idx, 1);
      await sSet('oc:' + openOC.id, openOC);
      await loadFeed();
      openOC = feedCache.find(o => o.id === openOC.id);
      renderModalOnly();
    };
  });

  // --- EDIT/DELETE OC BUTTONS ---
  if (isOwner) {
    const editBtn = document.getElementById('edit-oc-btn');
    if (editBtn) {
      editBtn.onclick = (e) => {
        e.stopPropagation();
        editingOC = openOC;
        formStickerLayers = openOC.stickerLayers ? openOC.stickerLayers.map(l => ({ ...l })) : [];
        formImages = openOC.images ? [...openOC.images] : [];
        formBgTheme = openOC.bgTheme || 'none';
        selectedStickerId = null;
        selectedPronoun = openOC.pronouns || '';
        selectedGender = openOC.gender || '';
        openOC = null;
        tab = 'oc-form';
        ocFormError = '';
        render();
      };
    }
    const delBtn = document.getElementById('delete-oc-btn');
    if (delBtn) {
      delBtn.onclick = async (e) => {
        e.stopPropagation();
        if (!confirm('Delete this character permanently? This can\'t be undone.')) return;
        await sDelete('oc:' + openOC.id);
        openOC = null;
        await loadFeed();
        await loadMyOCs();
        render();
      };
    }
  }

  // --- LIKE BUTTON ---
  const likeBtn = document.getElementById('like-btn');
  if (likeBtn) {
    likeBtn.onclick = async (e) => {
      e.stopPropagation();
      if (!currentUser) return;
      openOC.likes = openOC.likes || [];
      const idx = openOC.likes.indexOf(currentUser.email);
      if (idx >= 0) {
        openOC.likes.splice(idx, 1);
      } else {
        openOC.likes.push(currentUser.email);
        if (openOC.owner !== currentUser.email) {
          await addNotificationForUser(openOC.owner, `❤️ ${currentUser.displayName} liked your character "${openOC.name}"`);
        }
      }
      await sSet('oc:' + openOC.id, openOC);
      await loadFeed();
      openOC = feedCache.find(o => o.id === openOC.id);
      notifications = await loadNotificationsForUser(currentUser.email);
      renderModalOnly();
      renderFeedIfVisible();
    };
  }

  // Helper function to submit comment
  function submitComment() {
    const textarea = document.getElementById('comment-textarea');
    if (!textarea || !textarea.value.trim()) return;
    
    const text = textarea.value.trim();
    openOC.comments = openOC.comments || [];
    openOC.comments.push({
      email: currentUser.email,
      name: currentUser.displayName,
      avatar: currentUser.avatar || '',
      text: text,
      date: new Date().toISOString(),
      reactions: {},
      likes: []
    });
    
    if (openOC.owner !== currentUser.email) {
      addNotificationForUser(openOC.owner, `💬 ${currentUser.displayName} commented on "${openOC.name}": "${text.slice(0, 50)}${text.length > 50 ? '...' : ''}"`);
    }
    
    sSet('oc:' + openOC.id, openOC);
    loadFeed();
    openOC = feedCache.find(o => o.id === openOC.id);
    renderModalOnly();
  }
}

function renderFeedIfVisible() {
  if (tab === 'feed') {
    const mainContent = document.getElementById('main-content');
    if (mainContent) {
      mainContent.innerHTML = renderNotificationsPanel() + renderFeedTab();
      reattachFeedOpen();
      wireFeedControls();
    }
  }
}

// ====== AUTH HANDLERS ======
async function handleLogin(e) {
  e.preventDefault();
  authError = '';
  authSuccess = '';
  const fd = new FormData(e.target);
  const email = fd.get('email').trim().toLowerCase();
  const password = fd.get('password');

  const user = await sGet('user:' + email);
  if (!user) {
    authError = 'No account found with that username. Please sign up first.';
    render();
    return;
  }

  if (user.passwordHash !== simpleObscure(password)) {
    authError = 'Incorrect password. Please try again.';
    render();
    return;
  }

  currentUser = user;
  applyTheme(user.themePref || 'bubblegum');
  if (user.fontPref) applyFont(user.fontPref);
  screen = 'app';
  tab = 'feed';
  authSuccess = '';
  authError = '';

  await loadFeed();
  notifications = await loadNotificationsForUser(currentUser.email);
  localStorage.setItem('lastUser', currentUser.email);
  render();
}

async function handleSignupRequest(e) {
  e.preventDefault();
  authError = '';
  authSuccess = '';
  const fd = new FormData(e.target);
  const displayName = fd.get('displayName').trim();
  const email = fd.get('email').trim().toLowerCase();
  const password = fd.get('password');

  if (!displayName || !email || !password) {
    authError = 'Please fill in all fields.';
    render();
    return;
  }

  if (password.length < 6) {
    authError = 'Password must be at least 6 characters.';
    render();
    return;
  }

  const existing = await sGet('user:' + email);
  if (existing) {
    authError = 'An account with that username already exists. Please log in instead.';
    render();
    return;
  }

  const newUser = {
    email,
    passwordHash: simpleObscure(password),
    displayName,
    pronouns: '',
    gender: '',
    bio: '',
    avatar: '',
    themePref: 'bubblegum',
    fontPref: 'quicksand',
    joinDate: new Date().toISOString()
  };

  await sSet('user:' + newUser.email, newUser);

  currentUser = newUser;
  applyTheme('bubblegum');
  screen = 'app';
  tab = 'feed';
  authMode = 'login';
  authError = '';
  authSuccess = '';

  await loadFeed();
  notifications = await loadNotificationsForUser(currentUser.email);
  localStorage.setItem('lastUser', currentUser.email);
  render();
}

// ====== OC FORM SUBMIT ======
async function handleOCFormSubmit(e) {
  e.preventDefault();
  ocFormError = '';
  const fd = new FormData(e.target);
  const name = fd.get('name').trim();
  const desc = fd.get('desc').trim();
  const pronouns = fd.get('pronouns').trim();
  const gender = fd.get('gender').trim();
  const tagsStr = fd.get('tags').trim();
  const contentWarning = fd.has('contentWarning');

  if (!name || !desc) {
    ocFormError = 'Please fill in a name and description.';
    render();
    return;
  }

  const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : [];

  if (editingOC) {
    editingOC.name = name;
    editingOC.desc = desc;
    editingOC.pronouns = pronouns;
    editingOC.gender = gender;
    editingOC.tags = tags;
    editingOC.contentWarning = contentWarning;
    if (formImages.length > 0) {
      editingOC.images = formImages;
      editingOC.image = formImages[0];
    }
    editingOC.stickerLayers = formStickerLayers.map(l => ({ ...l }));
    editingOC.stickers = formStickerLayers.map(l => l.src);
    editingOC.bgTheme = formBgTheme;
    await sSet('oc:' + editingOC.id, editingOC);
  } else {
    const oc = {
      id: uid(),
      owner: currentUser.email,
      ownerName: currentUser.displayName,
      name,
      desc,
      pronouns,
      gender,
      image: formImages.length > 0 ? formImages[0] : null,
      images: formImages,
      bgTheme: formBgTheme,
      stickerLayers: formStickerLayers.map(l => ({ ...l })),
      stickers: formStickerLayers.map(l => l.src),
      tags,
      contentWarning,
      createdAt: new Date().toISOString(),
      likes: [],
      comments: [],
      relationships: []
    };
    await sSet('oc:' + oc.id, oc);
    addNotificationForUser(currentUser.email, `🎨 You created a new character: "${oc.name}"`);
  }

  editingOC = null;
  formStickerLayers = [];
  formImages = [];
  formBgTheme = 'none';
  selectedStickerId = null;
  selectedPronoun = '';
  selectedGender = '';

  await loadFeed();
  await loadMyOCs();
  tab = 'myocs';
  render();
}
